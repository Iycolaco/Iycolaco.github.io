<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model</title>
        <script src="../validate.js"></script>
    <style>
        #red{
            background-color:red;
            height:100px;
            width:100px;
            border: 2px black solid;
            background-clip:content-box;
            margin-left:300px;
        }
        #blue{
            background-color:blue;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            padding:100px;
            margin-left:400px;
        }
        #green{
            background-color:green;
            height:100px;
            width:100px;
            border:1px black solid;
            background-clip:content-box;
            padding-left:25px;
        }
        #yellow{
            background-color:yellow;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;

            padding-right:25px;
            padding-top:25px;
            margin-left:325px;
        }

        #purple{
            background-color:purple;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            padding-bottom:100px;
            margin-left:225px;
        }
    </style>
    </head>
    <body>
        <h1>Look at dem boxes</h1>
        <div id="red"></div>
        <div id="blue"></div>
        <div id="green"></div>
